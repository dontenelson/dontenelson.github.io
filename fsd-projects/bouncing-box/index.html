<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    body {
      margin: 0;
      transition: background-color 0.25s ease;
    }

    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      left: 0px;
    }

    .board {
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .score {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.25);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
    }

    .scoreboard {
      position: absolute;
      top: 72px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.25);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      max-width: 280px;
    }

    .portfolio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .color-picker {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .color-picker label {
      font-size: 14px;
      font-weight: bold;
      color: #222;
    }

    .color-picker select {
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
      background: #fff;
    }

    .welcome-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .welcome-card {
      background: white;
      border-radius: 16px;
      padding: 30px 24px;
      width: min(90vw, 420px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .welcome-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #222;
    }

    .welcome-card input {
      width: 100%;
      box-sizing: border-box;
      margin: 14px 0;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ccc;
      font-size: 18px;
    }

    .welcome-card button {
      background: #4dabf7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .timer {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.25);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      min-width: 120px;
      text-align: center;
    }

    .game-over-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .game-over-card {
      background: white;
      border-radius: 16px;
      padding: 30px 24px;
      width: min(90vw, 400px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .game-over-card h2 {
      margin-top: 0;
      color: #222;
    }

    .game-over-card button {
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <a class="portfolio-btn" href="../../portfolio.html">Portfolio</a>
  <div class="score">Score: <span id="score">0</span></div>
  <div class="scoreboard" id="scoreboard">Player: Player | High Score: 0</div>
  <div class="timer">Time: <span id="timer">2:00</span></div>

  <div class="color-picker">
    <label for="boxColor">Box color:</label>
    <select id="boxColor">
      <option value="black">Black</option>
      <option value="green">Green</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="brown">Brown</option>
      <option value="pink">Pink</option>
      <option value="gray">Gray</option>
      <option value="orange">Orange</option>
    </select>
  </div>

  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-card">
      <h2>Welcome!</h2>
      <label for="playerName">Enter player name</label>
      <input id="playerName" type="text" maxlength="12" placeholder="Player name" />
      <button id="startGameBtn">Start Game</button>
    </div>
  </div>

  <div class="game-over-screen" id="gameOverScreen">
    <div class="game-over-card">
      <h2>Game Over</h2>
      <p id="finalScoreText">Final Score: 0</p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <!-- HTML for the box -->
  <div class="box">☺</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      var box = jQuery(".box");
      var board = jQuery(".board");
      var boardWidth = board.width() - box.outerWidth();
      var boardHeight = board.height() - box.outerHeight();
      var colors = ["#ff6b6b", "#ffd93d", "#6bcf7b", "#4dabf7", "#b197fc", "#ff9f1c"];
      var colorIndex = 0;
      var backgroundTimer = setInterval(function () {
        colorIndex = (colorIndex + 1) % colors.length;
        jQuery("body").css("background-color", colors[colorIndex]);
      }, 1800);

      jQuery(window).on("resize", function () {
        boardWidth = board.width() - box.outerWidth();
        boardHeight = board.height() - box.outerHeight();

        if (positionX > boardWidth) {
          positionX = boardWidth;
        }
        if (positionY > boardHeight) {
          positionY = boardHeight;
        }
        if (positionX < 0) {
          positionX = 0;
        }
        if (positionY < 0) {
          positionY = 0;
        }

        moveBoxTo(positionX, positionY);
      });

      setInterval(update, 50);
      box.on("click", handleBoxClick);

      jQuery("#boxColor").on("change", function () {
        var selectedColor = jQuery(this).val();
        var colorMap = {
          black: "#000000",
          green: "#228B22",
          red: "#d62828",
          purple: "#6a0dad",
          brown: "#8b4513",
          pink: "#ff69b4",
          gray: "#808080",
          orange: "#ff8c00"
        };

        box.css("background-color", colorMap[selectedColor]);
      });

      function moveBoxTo(newPositionX, newPositionY) {
        box.css({
          left: newPositionX + "px",
          top: newPositionY + "px"
        });
      }

      function updateScoreboard() {
        var currentPlayer = playerName || "Player";
        var highScore = Number(localStorage.getItem("bouncingBoxHighScore")) || 0;
        var highScorePlayer = localStorage.getItem("bouncingBoxHighScorePlayer") || "Player";

        jQuery("#scoreboard").text("Player: " + currentPlayer + " | High Score: " + highScorePlayer + ": " + highScore);
      }

      function changeBoxText(newText) {
        box.text("☺");
        jQuery("#score").text(newText);
        updateScoreboard();
      }

      function changeBoardColor() {
        colorIndex = (colorIndex + 1) % colors.length;
        jQuery("body").css("background-color", colors[colorIndex]);
      }

      var positionX = 0;
      var positionY = 100;
      var points = 0;
      var speedX = 8;
      var speedY = 6;
      var playerName = "Player";
      var gameDuration = 120;
      var timeLeft = gameDuration;
      var isGameActive = false;
      var timerId = null;

      updateScoreboard();

      function updateTimerDisplay() {
        var minutes = Math.floor(timeLeft / 60);
        var seconds = timeLeft % 60;
        jQuery("#timer").text(minutes + ":" + (seconds < 10 ? "0" : "") + seconds);
      }

      function startGame() {
        isGameActive = true;
        points = 0;
        positionX = 0;
        positionY = 100;
        speedX = 8;
        speedY = 6;
        timeLeft = gameDuration;
        updateTimerDisplay();
        jQuery("#score").text(points);
        moveBoxTo(positionX, positionY);
        jQuery("#gameOverScreen").hide();
        jQuery("#welcomeScreen").hide();

        if (timerId) {
          clearInterval(timerId);
        }

        timerId = setInterval(function () {
          if (!isGameActive) {
            return;
          }

          timeLeft -= 1;
          updateTimerDisplay();

          if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerDisplay();
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        isGameActive = false;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }

        var currentHighScore = Number(localStorage.getItem("bouncingBoxHighScore")) || 0;
        if (points > currentHighScore) {
          localStorage.setItem("bouncingBoxHighScore", points);
          localStorage.setItem("bouncingBoxHighScorePlayer", playerName);
        }

        updateScoreboard();
        jQuery("#finalScoreText").text("Final Score: " + points);
        jQuery("#gameOverScreen").css("display", "flex");
      }

      jQuery("#startGameBtn").on("click", function () {
        playerName = jQuery("#playerName").val().trim() || "Player";
        updateScoreboard();
        startGame();
      });

      jQuery("#playAgainBtn").on("click", function () {
        startGame();
      });

      updateTimerDisplay();

      function update() {
        if (!isGameActive) {
          return;
        }
        positionX += speedX;
        positionY += speedY;

        var hitLeftOrRight = false;
        var hitTopOrBottom = false;
        var hitCorner = false;

        if (positionX >= boardWidth) {
          positionX = boardWidth;
          speedX *= -1;
          hitLeftOrRight = true;
        } else if (positionX <= 0) {
          positionX = 0;
          speedX *= -1;
          hitLeftOrRight = true;
        }

        if (positionY >= boardHeight) {
          positionY = boardHeight;
          speedY *= -1;
          hitTopOrBottom = true;
        } else if (positionY <= 0) {
          positionY = 0;
          speedY *= -1;
          hitTopOrBottom = true;
        }

        if ((positionX === 0 || positionX === boardWidth) && (positionY === 0 || positionY === boardHeight)) {
          hitCorner = true;
        }

        if (hitCorner) {
          changeBoardColor();
        }

        moveBoxTo(positionX, positionY);
      }

      function handleBoxClick() {
        if (!isGameActive) {
          return;
        }

        points++;
        speedX = (speedX >= 0 ? speedX : -speedX) + 1;
        speedY = (speedY >= 0 ? speedY : -speedY) + 1;
        changeBoxText(points);
      }
    })();
  </script>
</body>

</html>
